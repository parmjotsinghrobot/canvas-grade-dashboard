name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install -e . build
      - run: python -m unittest discover -s tests
      - run: node tests/test_exporter.cjs
      - run: python -m build
      - run: python scripts/check_dist.py
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -I scripts/smoke_install.py
      - run: canvas-grades --version
